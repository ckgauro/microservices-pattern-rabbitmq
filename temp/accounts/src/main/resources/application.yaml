server:
  port: 8081

spring:
  application:
    name: accounts

  datasource:
    url: jdbc:postgresql://localhost:5432/postgres?currentSchema=microservices&ssl=false
    username: postgres
    password: oracle
    driver-class-name: org.postgresql.Driver

  sql:
    init:
      mode: always

  jpa:
    show-sql: true
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect



logging:
#  level:
#    org.hibernate.SQL: debug
#    org.hibernate.tool.schema: debug
  pattern:
    console: "%green(%d{HH:mm:ss.SSS}) %blue(%-5level) %red([%thread]) %yellow(%logger{15}) -%msg%n"